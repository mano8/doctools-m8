[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doctools-m8"
version = "0.1.0"
description = "Media-neutral document toolkit: models, revisions, the versioned artifact envelope, the PDF/plain-text parsers, the parser sandbox supervisor and the provenance verifier."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eli Serra", email = "e.serra173@gmail.com" }]
requires-python = ">=3.12"
keywords = ["documents", "pdf", "sandbox", "provenance", "ocr", "chunking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# PdfiumParser / inspect().
pdf = ["pypdfium2>=4"]
# The parser sandbox supervisor: the C-03 signed-object implementation.
sandbox = ["ai-sdk-m8[jobcontext]"]
# T42a's provenance verifier: the same signed-object implementation.
provenance = ["ai-sdk-m8[jobcontext]"]
# Optional Docling parser (placeholder until T65).
docling = []
test = ["pytest>=8.0", "pytest-cov>=6.0", "coverage>=7.0", "hypothesis>=6.100",
        "pyyaml>=6.0", "types-PyYAML"]
dev = ["ruff>=0.9.0", "mypy>=1.14.0", "bandit>=1.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["doctools_m8"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "C90", "D"]
ignore = [
    "E501",
    "D100", "D104", "D105", "D107",
    "D203", "D211", "D212", "D215",
    "D301", "D401", "D403", "D404", "D415", "D416", "D417",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["doctools_m8"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=doctools_m8 --cov-report=xml --cov-report=term-missing"
